name: Release Digitall.Testing

on:
  push:
    branches: [ "main", "beta" ]
  workflow_dispatch:

jobs:
  release:
    name: Semantic Release
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CI_GITHUB_TOKEN }}
          fetch-depth: 0
          fetch-tags: true
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Restore DotNet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Install packages
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Dotnet Restore
        run: dotnet restore
      - name: Materialize Signing Key
        id: write_sign_key_file
        uses: timheuer/base64-to-file@v1
        with:
          fileName: 'key.snk'
          encodedString: ${{ secrets.SIGNING_KEY }}
      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
          AssemblyOriginatorKeyFile: ${{ steps.write_sign_key_file.outputs.filePath }}
        run: npx semantic-release
