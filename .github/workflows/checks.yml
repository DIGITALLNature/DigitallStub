name: Check Digitall.Testing

on:
  pull_request:
    branches: ["main", "beta"]

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v3

      - name: Restore DotNet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore

      - name: Run Tests
        run: dotnet run --project tests/Digitall.Testing.Tests --no-build --framework net10.0 -- --report-trx --report-trx-filename test-results.trx
